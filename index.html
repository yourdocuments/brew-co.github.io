<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brew &amp; Co — Treat yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#b3141f;--dark:#7d0a12;--ink:#2a1a1a;--pink:#f9e3e3;--grey:#e1dfdb}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,"Noto Sans Bengali","Noto Sans Arabic","Noto Sans JP",system-ui,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
background:radial-gradient(circle at 20% 0%,#d41a12,#8e0a05 70%);background-size:140% 140%;animation:bg 14s ease-in-out infinite alternate;overflow-x:hidden}
@keyframes bg{to{background-position:100% 100%}}
.shell{position:relative;width:min(1100px,100%);background:#fff;border-radius:18px;padding:26px 36px 90px;box-shadow:0 40px 80px rgba(0,0,0,.35);animation:rise .9s cubic-bezier(.2,.8,.2,1) both;overflow:visible}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}}
.blob{position:absolute;right:12%;top:0;width:370px;height:370px;border-radius:50%;background:var(--pink);transform:translateY(-8%);animation:pulse 6s ease-in-out infinite;z-index:0}
@keyframes pulse{50%{transform:translateY(-8%) scale(1.06)}}
nav{position:relative;z-index:2;display:flex;align-items:center;gap:26px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.logo{font-family:"Abril Fatface",serif;font-size:26px;color:var(--red);letter-spacing:0;text-transform:none;font-style:italic}
nav a{color:var(--ink);text-decoration:none;position:relative}
nav a:after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:0;background:var(--red);transition:.3s}
nav a:hover:after{width:100%}
.sp{flex:1}
.search{border:0;border-bottom:1px solid #bbb;font:inherit;font-size:10px;padding:4px;width:170px;outline:0;background:transparent}
.cart{cursor:pointer;display:flex;gap:6px;align-items:center;background:none;border:0;font:inherit;letter-spacing:inherit;text-transform:inherit}
#count{background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:10px}
#count.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.6)}}
select.lang{font:inherit;font-size:11px;border:1px solid #ddd;border-radius:20px;padding:4px 8px;background:#fff}
.hero{position:relative;z-index:2;display:flex;justify-content:space-between;gap:20px;margin-top:34px;min-height:110px}
.quote{display:flex;gap:10px;max-width:230px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#555;animation:fade 1s .5s both}
.quote b{font-family:"Abril Fatface",serif;font-size:70px;line-height:.8;color:var(--red)}
h1{font-family:"Abril Fatface",serif;font-weight:400;font-size:clamp(34px,6vw,60px);line-height:1;color:var(--red);text-align:end}
h1 span{display:block;overflow:hidden}
h1 span i{display:block;font-style:normal;animation:slide .9s cubic-bezier(.2,.8,.2,1) both}
h1 span:nth-child(2) i{animation-delay:.2s}
@keyframes slide{from{transform:translateY(110%)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.stage{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:18px;margin-top:70px}
.arrow{position:absolute;top:60%;background:none;border:0;font-size:34px;color:#999;cursor:pointer;transition:.2s;z-index:5}
.arrow:hover{color:var(--red);transform:scale(1.3)}
.arrow.l{left:-14px}.arrow.r{right:-14px}
.card{position:relative;width:190px;background:var(--grey);border-radius:6px 6px 22px 22px;padding:84px 14px 16px;cursor:pointer;
transition:all .55s cubic-bezier(.2,.8,.2,1);animation:fade .8s both;box-shadow:0 12px 24px rgba(0,0,0,.12)}
.card:nth-child(2){animation-delay:.15s}.card:nth-child(3){animation-delay:.3s}.card:nth-child(4){animation-delay:.45s}
.card:hover{transform:translateY(-8px)}
.card .mug{position:absolute;left:50%;top:-52px;width:120px;transform:translateX(-50%);transition:.55s;filter:drop-shadow(0 12px 10px rgba(0,0,0,.2))}
.card h3{font-family:"Abril Fatface",serif;font-weight:400;font-size:17px;line-height:1.15;margin-bottom:12px}
.nut{font-size:8.5px;line-height:1.7;color:#444}
.nut div{display:flex;justify-content:space-between}
.ctrl{max-height:0;opacity:0;overflow:hidden;transition:all .55s}
.card.active{width:240px;background:var(--red);color:#fff;padding-top:150px;padding-bottom:22px;transform:translateY(34px);z-index:3;
background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 6px,transparent 6px 22px),repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 6px,transparent 6px 22px);box-shadow:0 30px 50px rgba(120,0,0,.5)}
.card.active:hover{transform:translateY(26px)}
.card.active .mug{width:220px;top:-110px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateX(-50%) translateY(-10px) rotate(-1.5deg)}}
.card.active h3{font-size:25px;color:#fff}
.card.active .nut{display:none}
.card.active .ctrl{max-height:260px;opacity:1}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:12px 0}
.row .opts{display:flex;gap:6px;align-items:center;font-size:10px}
.pill{border:0;cursor:pointer;border-radius:20px;padding:3px 9px;font:inherit;background:transparent;color:#fff;opacity:.75;transition:.25s}
.pill.on{background:#fff;color:var(--red);opacity:1;font-weight:600}
.opts select{font:inherit;font-size:10px;background:transparent;color:#fff;border:0;border-bottom:1px solid #ffffff80;padding:2px}
.opts select option{color:#000}
.add{width:100%;margin-top:14px;padding:11px;border:0;border-radius:30px;background:#fff;color:var(--ink);letter-spacing:.2em;text-transform:uppercase;font:500 11px Poppins,sans-serif;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.add:hover{transform:scale(1.04);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.add.done{background:#2e9e5b;color:#fff}
.steam{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;opacity:0;animation:steam 3s infinite}
.steam:nth-of-type(2){animation-delay:1s}.steam:nth-of-type(3){animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.7}100%{opacity:0;transform:translateY(-14px)}}
[dir=rtl] .arrow.l{left:auto;right:-14px}[dir=rtl] .arrow.r{right:auto;left:-14px}
@media(max-width:820px){.shell{padding:20px 18px 80px}.hero{flex-direction:column}h1{text-align:start}.search,.blob{display:none}nav{flex-wrap:wrap;gap:14px}
.stage{overflow-x:auto;justify-content:flex-start;padding:130px 10px 50px;margin-top:0;scroll-snap-type:x mandatory}.card{flex:none;scroll-snap-align:center}.arrow{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="blob"></div>
  <nav>
    <div class="logo">Brew &amp; Co</div>
    <a href="#" data-t="coffee"></a><a href="#" data-t="tea"></a><a href="#" data-t="specialty"></a><a href="#" data-t="menu"></a>
    <div class="sp"></div>
    <input class="search" data-p="search">
    <select class="lang" id="lang" aria-label="Language"></select>
    <button class="cart">🛒 <span data-t="cart"></span> <span id="count">0</span></button>
  </nav>
  <div class="hero">
    <div class="quote"><b>“</b><span data-t="quote"></span></div>
    <h1><span><i data-t="h1"></i></span><span><i data-t="h2"></i></span></h1>
  </div>
  <button class="arrow l" id="prev" aria-label="prev">‹</button>
  <button class="arrow r" id="next" aria-label="next">›</button>
  <div class="stage" id="stage"></div>
</div>

<script>
/* ---------- 7 languages ---------- */
const L={
en:{n:"English",coffee:"Coffee",tea:"Tea",specialty:"Specialty",menu:"Menu",search:"Find your favourites",cart:"Cart",
quote:"Got a latte problem? We’ve got a drink for that…",h1:"Treat yourself,",h2:"today.",size:"Size",flavour:"Flavour",type:"Type",hot:"hot",iced:"iced",add:"Add to cart",added:"Added ✓",cal:"Calories",fat:"Total fat",sug:"Total sugars",
d:["Signature French Vanilla","Handcrafted Latte","Dark Chocolate Mocha","Classic Cappuccino"]},
bn:{n:"বাংলা",coffee:"কফি",tea:"চা",specialty:"স্পেশালিটি",menu:"মেনু",search:"আপনার পছন্দ খুঁজুন",cart:"কার্ট",
quote:"ল্যাটে নিয়ে ঝামেলা? আমাদের কাছে আছে সমাধান…",h1:"নিজেকে আদর করুন,",h2:"আজই।",size:"সাইজ",flavour:"ফ্লেভার",type:"ধরন",hot:"গরম",iced:"ঠান্ডা",add:"কার্টে যোগ করুন",added:"যোগ হয়েছে ✓",cal:"ক্যালরি",fat:"মোট ফ্যাট",sug:"মোট চিনি",
d:["সিগনেচার ফ্রেঞ্চ ভ্যানিলা","হ্যান্ডক্রাফটেড ল্যাটে","ডার্ক চকলেট মোকা","ক্লাসিক ক্যাপুচিনো"]},
hi:{n:"हिन्दी",coffee:"कॉफ़ी",tea:"चाय",specialty:"स्पेशल",menu:"मेन्यू",search:"अपनी पसंद खोजें",cart:"कार्ट",
quote:"लैटे की समस्या? हमारे पास है इसका हल…",h1:"खुद को दें तोहफ़ा,",h2:"आज ही।",size:"साइज़",flavour:"फ्लेवर",type:"प्रकार",hot:"गरम",iced:"ठंडा",add:"कार्ट में जोड़ें",added:"जुड़ गया ✓",cal:"कैलोरी",fat:"कुल वसा",sug:"कुल चीनी",
d:["सिग्नेचर फ्रेंच वनिला","हैंडक्राफ्टेड लैटे","डार्क चॉकलेट मोचा","क्लासिक कैपुचीनो"]},
ar:{n:"العربية",coffee:"قهوة",tea:"شاي",specialty:"مميز",menu:"القائمة",search:"ابحث عن مفضلاتك",cart:"السلة",
quote:"مشكلة مع اللاتيه؟ لدينا المشروب المناسب…",h1:"دلّل نفسك،",h2:"اليوم.",size:"الحجم",flavour:"النكهة",type:"النوع",hot:"ساخن",iced:"مثلج",add:"أضف إلى السلة",added:"تمت الإضافة ✓",cal:"السعرات",fat:"إجمالي الدهون",sug:"إجمالي السكر",
d:["فانيلا فرنسية مميزة","لاتيه محضّر يدوياً","موكا شوكولاتة داكنة","كابتشينو كلاسيكي"]},
es:{n:"Español",coffee:"Café",tea:"Té",specialty:"Especiales",menu:"Menú",search:"Busca tus favoritos",cart:"Carrito",
quote:"¿Problemas con el latte? Tenemos una bebida para eso…",h1:"Date un gusto,",h2:"hoy.",size:"Tamaño",flavour:"Sabor",type:"Tipo",hot:"caliente",iced:"frío",add:"Añadir al carrito",added:"Añadido ✓",cal:"Calorías",fat:"Grasa total",sug:"Azúcares",
d:["Vainilla francesa","Latte artesanal","Moca chocolate negro","Capuchino clásico"]},
fr:{n:"Français",coffee:"Café",tea:"Thé",specialty:"Spécialités",menu:"Menu",search:"Trouvez vos favoris",cart:"Panier",
quote:"Un souci de latte ? On a la boisson qu’il vous faut…",h1:"Faites-vous plaisir,",h2:"aujourd’hui.",size:"Taille",flavour:"Saveur",type:"Type",hot:"chaud",iced:"glacé",add:"Ajouter au panier",added:"Ajouté ✓",cal:"Calories",fat:"Lipides",sug:"Sucres",
d:["Vanille française","Latte artisanal","Moka chocolat noir","Cappuccino classique"]},
ja:{n:"日本語",coffee:"コーヒー",tea:"ティー",specialty:"スペシャル",menu:"メニュー",search:"お気に入りを探す",cart:"カート",
quote:"ラテでお悩み？ぴったりの一杯があります…",h1:"今日は自分に",h2:"ご褒美を。",size:"サイズ",flavour:"フレーバー",type:"タイプ",hot:"ホット",iced:"アイス",add:"カートに追加",added:"追加済み ✓",cal:"カロリー",fat:"脂質",sug:"糖質",
d:["フレンチバニラ","ハンドクラフトラテ","ダークチョコモカ","クラシックカプチーノ"]}
};
const TZ={"Asia/Dhaka":"bn","Asia/Kolkata":"hi","Asia/Calcutta":"hi","Asia/Riyadh":"ar","Asia/Dubai":"ar","Asia/Qatar":"ar","Asia/Kuwait":"ar","Asia/Baghdad":"ar","Africa/Cairo":"ar","Africa/Casablanca":"ar","Asia/Amman":"ar","Asia/Beirut":"ar",
"Europe/Madrid":"es","America/Mexico_City":"es","America/Bogota":"es","America/Lima":"es","America/Argentina/Buenos_Aires":"es","America/Santiago":"es","Europe/Paris":"fr","Europe/Brussels":"fr","Africa/Algiers":"fr","America/Montreal":"fr","Asia/Tokyo":"ja"};
const REG={BD:"bn",IN:"hi",SA:"ar",AE:"ar",EG:"ar",QA:"ar",KW:"ar",ES:"es",MX:"es",CO:"es",AR:"es",FR:"fr",BE:"fr",JP:"ja"};
function detect(){
  const s=localStorage.getItem("lang");if(s&&L[s])return s;
  try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(TZ[tz])return TZ[tz]}catch(e){}
  for(const l of navigator.languages||[navigator.language]){
    const p=String(l).split("-");if(p[1]&&REG[p[1].toUpperCase()])return REG[p[1].toUpperCase()];
    if(L[p[0].toLowerCase()])return p[0].toLowerCase();
  }
  return "en";
}
/* ---------- drinks ---------- */
const D=[
{liq:"#c9a27a",foam:"#f3e8d6",cal:250,fat:8,sug:31,fl:["vanilla bean","caramel","hazelnut"],top:""},
{liq:"#8a5a44",foam:"#f6f0e8",cal:190,fat:7,sug:18,fl:["vanilla bean","maple","cinnamon"],top:""},
{liq:"#4a2a1e",foam:"#6b3f2c",cal:270,fat:11,sug:34,fl:["dark chocolate","mint","caramel"],top:"choc"},
{liq:"#a77a56",foam:"#f7f1e4",cal:150,fat:6,sug:12,fl:["classic","cocoa dust","vanilla"],top:""}];
const mug=d=>`<svg class="mug" viewBox="0 0 140 130" aria-hidden="true">
<path d="M104 40 q34 -2 28 30 q-4 22 -34 24" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="7"/>
<path d="M18 36 h86 v52 q0 28 -43 28 q-43 0 -43 -28z" fill="#fff" fill-opacity=".35" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
<path d="M22 50 h78 v38 q0 24 -39 24 q-39 0 -39 -24z" fill="${d.liq}"/>
<ellipse cx="61" cy="38" rx="43" ry="11" fill="${d.foam}"/>
${d.top?'<g fill="#3a1f14"><circle cx="45" cy="30" r="5"/><circle cx="60" cy="25" r="5"/><circle cx="75" cy="30" r="5"/><circle cx="53" cy="36" r="4"/><circle cx="68" cy="36" r="4"/></g>':''}
<path class="steam" d="M45 20 q-8 -10 0 -18"/><path class="steam" d="M62 18 q-8 -10 0 -18"/><path class="steam" d="M79 20 q-8 -10 0 -18"/></svg>`;
let lang=detect(),cur=1,cart=0,size={},type={};
const stage=document.getElementById("stage");
D.forEach((d,i)=>{size[i]="M";type[i]="hot"});
function build(){
  stage.innerHTML=D.map((d,i)=>`<div class="card" data-i="${i}">${mug(d)}<h3></h3>
  <div class="nut"><div><b data-k="cal"></b><b>${d.cal}</b></div><div><span data-k="fat"></span><span>${d.fat}g</span></div><div><span data-k="sug"></span><span>${d.sug}g</span></div></div>
  <div class="ctrl">
   <div class="row"><span data-k="size"></span><div class="opts">${["S","M","L"].map(s=>`<button class="pill ${s==="M"?"on":""}" data-size="${s}">${s}</button>`).join("")}</div></div>
   <div class="row"><span data-k="flavour"></span><div class="opts"><select>${d.fl.map(f=>`<option>${f}</option>`).join("")}</select></div></div>
   <div class="row"><span data-k="type"></span><div class="opts"><button class="pill on" data-type="hot"></button><button class="pill" data-type="iced"></button></div></div>
   <button class="add"></button></div></div>`).join("");
}
function text(){
  const t=L[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t[e.dataset.p]);
  document.querySelectorAll(".card").forEach((c,i)=>{
    c.querySelector("h3").textContent=t.d[i];
    c.querySelectorAll("[data-k]").forEach(e=>e.textContent=t[e.dataset.k]);
    c.querySelectorAll("[data-type]").forEach(b=>b.textContent=t[b.dataset.type]);
    c.querySelector(".add").textContent=t.add;
  });
}
function show(){document.querySelectorAll(".card").forEach((c,i)=>c.classList.toggle("active",i===cur))}
build();text();show();
const sel=document.getElementById("lang");
sel.innerHTML=Object.keys(L).map(k=>`<option value="${k}">${L[k].n}</option>`).join("");sel.value=lang;
sel.onchange=()=>{lang=sel.value;localStorage.setItem("lang",lang);text()};
stage.addEventListener("click",e=>{
  const c=e.target.closest(".card");if(!c)return;const i=+c.dataset.i;
  if(i!==cur){cur=i;show();return}
  const sz=e.target.closest("[data-size]"),ty=e.target.closest("[data-type]");
  if(sz){c.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("on",b===sz))}
  if(ty){c.querySelectorAll("[data-type]").forEach(b=>b.classList.toggle("on",b===ty))}
  if(e.target.closest(".add")){
    const b=e.target.closest(".add"),n=document.getElementById("count");
    n.textContent=++cart;n.classList.remove("bump");void n.offsetWidth;n.classList.add("bump");
    b.textContent=L[lang].added;b.classList.add("done");
    setTimeout(()=>{b.textContent=L[lang].add;b.classList.remove("done")},1400);
  }
});
const go=n=>{cur=(cur+n+D.length)%D.length;show()};
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
</script>
</body>
</html>
